[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-headless-runner"
version = "0.1.0"
description = "Rotinas claude -p agendadas que nunca falham em silêncio: contrato de saída, retry, alerta e vigia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renato Brito" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-runner = "claude_runner.cli:main"

[tool.setuptools]
packages = ["claude_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
